name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: XcodeGen 설치
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: 앱과 위젯 프로젝트 만들기
        working-directory: ios
        run: xcodegen generate

      - name: iPhone 시뮬레이터 선택
        run: |
          set -euo pipefail
          NEL_SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, rows in devices.items() if "iOS" in runtime
                    for d in rows if d["isAvailable"] and d["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No iPhone simulator is available")
          print(phones[0]["udid"])
          ')
          echo "NEL_SIMULATOR_ID=$NEL_SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: 시뮬레이터용 앱·위젯·테스트 컴파일
        working-directory: ios
        run: |
          xcodebuild -quiet \
            -project NelNote.xcodeproj \
            -scheme NelNote \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$NEL_SIMULATOR_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: 시뮬레이터에서 Obsidian·위젯·대용량 목록 검증
        working-directory: ios
        run: |
          xcrun simctl boot "$NEL_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$NEL_SIMULATOR_ID" -b
          xcodebuild \
            -project NelNote.xcodeproj \
            -scheme NelNote \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$NEL_SIMULATOR_ID" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: 테스트 화면 추출
        if: always()
        working-directory: ios
        run: |
          if [ -d TestResults.xcresult ]; then
            mkdir -p build/previews
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path build/previews
          fi

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NelNote-test-results
          path: |
            ios/TestResults.xcresult
            ios/build/previews
          if-no-files-found: ignore
          retention-days: 14

      - name: iPhone 앱과 위젯 빌드
        working-directory: ios
        run: |
          xcodebuild -quiet \
            -project NelNote.xcodeproj \
            -scheme NelNote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 위젯 포함 IPA 만들기
        working-directory: ios
        run: bash scripts/package-ipa.sh

      - name: IPA 보관
        uses: actions/upload-artifact@v4
        with:
          name: NelNote-ipa
          path: ios/NelNote.ipa
          if-no-files-found: error

      - name: Releases에 올리기
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/nelnote-release.md" <<'NOTES'
          iOS 16 이상용 NEL NOTE와 도장깨기 위젯입니다.

          - 아이폰 Obsidian 보관함과 네 작품 DB 양방향 동기화
          - 작품 추가·삭제, 제목·상태, 애니 전체 화수·책 전체 쪽수 연결
          - 메모·세부 진행량은 앱에 유지하고 Obsidian 속성·본문·노트 링크 보존
          - 중단·다음 시즌 대기 상태, 제목 검색, 대용량 목록 처리
          - 삭제 기록·휴지통 복구·충돌 병합·실패 후 재시도 및 위젯 갱신

          설정 → Obsidian 연결에서 아이폰 보관함 전체를 선택하세요.
          노트북 반영은 기존 Remotely Save를 양쪽에서 실행하면 됩니다.

          IPA는 설치할 때 AltStore 등으로 본인 계정 서명이 필요합니다.
          위젯 확장을 유지하고 앱과 위젯에 같은 App Group 권한을 적용해 주세요.
          설치 후 앱을 한 번 연 다음, 홈 화면의 위젯 추가에서 도장깨기를 선택하세요.
          NOTES
          gh release create "ios-build-${GITHUB_RUN_NUMBER}" ios/NelNote.ipa \
            --target "$GITHUB_SHA" \
            --title "NEL NOTE iOS 2.3 (빌드 ${GITHUB_RUN_NUMBER})" \
            --notes-file "$RUNNER_TEMP/nelnote-release.md" \
            --latest
