# Generate the native app, its WidgetKit extension, and simulator tests.
name: NelNote
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.3"
    CURRENT_PROJECT_VERSION: "6"
    APP_GROUP_IDENTIFIER: group.com.nelnote.app
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2
targets:
  NelNote:
    type: application
    platform: iOS
    sources:
      - path: Native
      - path: Sync
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - package: Yams
      - target: NelNoteWidgets
        embed: true
    entitlements:
      path: NelNote.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NEL NOTE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        NelNoteAppGroup: $(APP_GROUP_IDENTIFIER)
        CFBundleURLTypes:
          - CFBundleURLName: com.nelnote.app
            CFBundleURLSchemes:
              - nelnote
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nelnote.app
        PRODUCT_NAME: NelNote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NelNoteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Sync/Model.swift
    entitlements:
      path: NelNoteWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: 도장깨기
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NelNoteAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nelnote.app.widgets
        PRODUCT_NAME: NelNoteWidgets
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  NelNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: SyncTests
    dependencies:
      - target: NelNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nelnote.app.tests
        GENERATE_INFOPLIST_FILE: YES
  NelNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: NelNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nelnote.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NelNote:
    build:
      targets:
        NelNote: all
    test:
      targets:
        - NelNoteTests
        - NelNoteUITests
